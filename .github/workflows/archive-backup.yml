# Daily backup of every stored Spontaneous Escapes month from the live site into archive/.
# Runs an hour after the site's own daily check (01:00 UTC). Commits only when something changed.
name: Archive backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch all stored months
        run: node scripts/backup-archive.mjs
      - name: Commit changes
        run: |
          git add archive
          if git diff --cached --quiet; then
            echo "Archive already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive backup: $(git diff --cached --name-only | sed 's#archive/##' | tr '\n' ' ')"
          git push
